[project]
name = "volvowatch-backend"
version = "0.0.1"
description = "OAuth/token proxy between the VolvoWatch Garmin app and the Volvo Cars API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "email-validator>=2.2",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "cryptography>=43",
    "python-multipart>=0.0.12",
    "itsdangerous>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "cairosvg>=2.7",  # watch/resources/drawables/make_icons.py
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
